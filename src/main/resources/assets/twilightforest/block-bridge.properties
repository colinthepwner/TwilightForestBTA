# Block-texture bridge manifest.
#
# The donor keeps its block art in a single 16x16-tile sprite sheet, the way every mod did before
# Minecraft 1.5. BTA wants one PNG per texture. This maps a tile index in the sheet onto a path in
# the generated pack, and TFBlockTextureBridge does the cutting.
#
# ⚠️ The donor is Twilight Forest 1.15.4 (Minecraft 1.4.7), not the 1.7.1 being ported -- see the
# header of asset-bridge.properties. 1.4.7 shipped eleven days before Minecraft 1.5 split terrain.png
# into per-block files, which is the entire reason this lane still works and the reason the donor was
# chosen from that side of the line.
#
#   <archive file name>#<tile index> = <path inside the generated pack>
#
# The tile index is the same number the original's block classes carry -- `blockIndexInTexture`, or
# the constant a block returns from getBlockTextureFromSideAndMetadata. Reading left to right, top to
# bottom: column = index & 15, row = index >> 4.
#
# The tile SIZE is derived from the sheet rather than assumed, so a double-resolution sheet still
# cuts correctly: a sheet is always 16 tiles across, so tile = width / 16.
#
# --- Why only seven tiles ------------------------------------------------------------------------
# Most of Twilight Forest's blocks do not use its own sheet at all. Upstream renders them on
# Minecraft's:
#
#   leaves       BlockTFLeaves.getBlockTextureFromSideAndMetadata delegates straight to Block.leaves,
#                so the three species draw as vanilla oak, spruce and birch
#   mazestone    BlockTFMazestone looks up a mimic block (stone, cobblestone, mossy cobblestone) and
#                returns ITS texture -- the whole point is that a maze wall reads as ordinary masonry
#   boss spawner constructed with vanilla index 65, the mob spawner cage
#   portal       constructed with vanilla index 14
#
# Those seven are wired to `minecraft:` textures in TFBlockModels and need nothing bridged, which is
# also why they draw correctly with no copy of the original present at all. Only the tiles below are
# Benimatic's own art.
#
# --- Where the indices come from ------------------------------------------------------------------
# Read out of the donor's own block classes -- the `spr*` constants and whatever
# getBlockTextureFromSideAndMetadata returns -- NOT counted off the sheet by eye. The sheet has gaps
# and a whole row of things that are not blocks, so eyeballing gives a plausible wrong answer, and a
# wrong tile index survives all the way to a screenshot.
#
#   BlockTFLog     sprTop = 0, sprOakSide = 1, sprCanopySide = 2, sprMangroveSide = 3
#   BlockTFFirefly sprFirefly = 4
#   BlockTFCicada  sprCicada  = 5
#   BlockTFHedge   blockIndexInTexture = 6
#
# ✅ RE-VERIFIED against the 1.15.4 donor: every one of those seven is UNCHANGED. Benimatic added to
# the sheet rather than rearranging it, so the donor swap cost this file nothing. Do not assume that
# holds for a future donor -- check, do not trust this note.
#
# Not yet wired, and here so the foliage work does not have to re-derive them:
#   BlockTFLog     sprDarkwoodSide = 12          -- the dark forest's trunks
#   BlockTFHedge   meta 1 returns 10             -- the dark forest's canopy, which is a HEDGE
#                                                   variant and not a leaf block; see
#                                                   docs/tf-1.15.4-inventory.md §4a
# Rainbow oak leaves need no tile at all: BlockTFLeaves delegates leafType 3 straight to vanilla oak
# leaves and does the rainbow with a colour multiplier instead.

terrain.png#0 = assets/twilightforest/textures/block/log_top.png
terrain.png#1 = assets/twilightforest/textures/block/log_twilight_oak_side.png
terrain.png#2 = assets/twilightforest/textures/block/log_canopy_side.png
terrain.png#3 = assets/twilightforest/textures/block/log_mangrove_side.png
terrain.png#4 = assets/twilightforest/textures/block/firefly.png
terrain.png#5 = assets/twilightforest/textures/block/cicada.png
terrain.png#6 = assets/twilightforest/textures/block/hedge.png

# --- Foliage, from the 1.15.4 donor. Neither tile exists in 1.7.1's sheet. -------------------------
# The darkwood trunk shares tile 0 for its top face with the other three species, so only the side is
# new. The canopy is BlockTFHedge's meta-1 return value, NOT a leaf tile -- see the header.
terrain.png#12 = assets/twilightforest/textures/block/log_darkwood_side.png
terrain.png#10 = assets/twilightforest/textures/block/leaves_darkwood.png

# Roots, which a dark canopy tree grows down into the dirt. BlockTFRoots.spRootSide = 13; its
# spOreRootSide = 14 is deliberately NOT bridged, because the ore root is not ported -- see
# BlockLogicTFRoots.
terrain.png#13 = assets/twilightforest/textures/block/roots.png

# --- The four magic trees, from the 1.15.4 donor. None of these exist in 1.7.1's sheet. -------------
#
# Read out of BlockTFMagicLog's own SPR_* constants, which come in fours -- side, top, and two more
# for the special block at the tree's heart:
#
#   SPR_TIMESIDE  112  SPR_TIMETOP  113   (SPR_TIMECLOCK      114, SPR_TIMECLOCKOFF     115)
#   SPR_TRANSSIDE 116  SPR_TRANSTOP 117   (SPR_TRANSHEART     118, SPR_TRANSHEARTOFF    119)
#   SPR_MINESIDE  120  SPR_MINETOP  121   (SPR_MINEGEM        122, SPR_MINEGEMOFF       123)
#   SPR_SORTSIDE  124  SPR_SORTTOP  125   (SPR_SORTEYE        126, SPR_SORTEYEOFF       127)
#
# The eight in brackets belong to BlockTFMagicLogSpecial -- the Timewood Clock, the Heart of
# Transformation, the Minewood Core and the Sortingwood Engine, each with a lit and an unlit face.
# Upstream marks all four [WIP] in its own lang/en_US.xml and the port does not carry them, so their
# tiles are deliberately NOT bridged. Bridging them would put art in the pack that nothing draws.
#
# ⚠️ Unlike the four ordinary log species, these do NOT share one top tile. BlockTFLog has a single
# `sprTop = 0` for all of its species; BlockTFMagicLog returns a DIFFERENT top per species, so each
# magic log needs two tiles rather than one.
terrain.png#112 = assets/twilightforest/textures/block/log_timewood_side.png
terrain.png#113 = assets/twilightforest/textures/block/log_timewood_top.png
terrain.png#116 = assets/twilightforest/textures/block/log_transwood_side.png
terrain.png#117 = assets/twilightforest/textures/block/log_transwood_top.png
terrain.png#120 = assets/twilightforest/textures/block/log_minewood_side.png
terrain.png#121 = assets/twilightforest/textures/block/log_minewood_top.png
terrain.png#124 = assets/twilightforest/textures/block/log_sortingwood_side.png
terrain.png#125 = assets/twilightforest/textures/block/log_sortingwood_top.png

# Magic leaves. THREE tiles for four species, and that is upstream's, not an omission here.
# BlockTFMagicLeaves.getBlockTextureFromSideAndMetadata is:
#
#   switch (meta & 3) { default: return 88; case 1: return 92; case 3: } return 94;
#
# -- so meta 0 and meta 2 BOTH return 88. The miner's tree has no leaf tile of its own and draws the
# Timewood one; what distinguishes it is the colour multiplier, which is per-species and positional.
# See BlockColorTFMagicLeaves.
#
# ⚠️ It looks like tile 90 ought to be the miner's leaves -- the numbering runs 88 leaves / 89 fx,
# 92 leaves / 93 fx, 94 leaves / 95 fx, leaving a suspicious 90/91 hole exactly where the third
# species belongs. Do not act on that. The rule for this file is that the index comes from the block
# class, and the block class says 88; anything else is counting squares by inference, which is the
# failure mode the header warns about. Upstream renders the miner's leaves as 88 and so does this.
#
# The `fx` tiles -- SPR_TIMEFX 89, SPR_TRANSFX 93, SPR_SORTFX 95 -- are declared on
# BlockTFMagicLeaves and referenced by NOTHING, in the whole archive, including its own renderer.
# Dead constants, so not bridged.
terrain.png#88 = assets/twilightforest/textures/block/leaves_timewood.png
terrain.png#92 = assets/twilightforest/textures/block/leaves_transformation.png
terrain.png#94 = assets/twilightforest/textures/block/leaves_sorting.png

# The magic saplings, which are the only way to obtain any of the four trees.
#
# ⚠️ These four indices are COMPUTED rather than named, and it is the one place in this file where
# that is correct. BlockTFSapling has no spr* constants at all; its whole texture lookup is
#
#   public int getBlockTextureFromSideAndMetadata(int side, int metadata) { return 96 + metadata; }
#
# so the sheet index IS 96 plus the species number, and the species numbers are the ones the
# generator switch in growTree keys on: 5 time, 6 transformation, 7 miner's, 8 sorting. That gives
# 101-104. Still read out of the block class, still not counted off the sheet -- the arithmetic is
# upstream's own and is right there in the method body.
#
# The other six of upstream's ten (96-100 and 105) are not bridged, because the six saplings that
# would use them are not registered -- see BlockLogicTFSapling.
terrain.png#101 = assets/twilightforest/textures/block/sapling_timewood.png
terrain.png#102 = assets/twilightforest/textures/block/sapling_transformation.png
terrain.png#103 = assets/twilightforest/textures/block/sapling_miners.png
terrain.png#104 = assets/twilightforest/textures/block/sapling_sorting.png
