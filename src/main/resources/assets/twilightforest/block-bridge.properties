# The translucent block. BlockTFTowerTranslucent declares its TEX_* constants public and they run
# 160 + metadata with no transposition.
#
# ✅ VERIFIED against the donor sheet rather than trusted, because these four look empty at a glance:
# cropping row 10 gives 12 opaque pixels for 160 and 161, 80 for 162 and 163, and 102 for 164, out of
# 256. That is real art and it is SUPPOSED to be sparse -- the block is not an opaque cube, its
