# Model bridge manifest.
#
# Maps an entity model class inside a player-supplied copy of Benimatic's Twilight Forest 1.p4 onto
# the Bedrock geometry this mod loads. Matching is on the class's base name only and is
# case-insensitive, so the layout inside the archive does not matter.
#
# This mod ships none of the original's geometry. The bridge reads a copy the player already has on
# disk and writes the converted result into their generated texture pack. See
# docs/asset-bridge.md for the key format and the transform.
#
# --- Why this is needed at all --------------------------------------------------------------------
# BTA 8.0 removed the classic ModelBase / ModelRenderer system entirely; entity models are Dragonfly
# StaticEntityModel loaded from Bedrock JSON geometry. So the original's four model classes cannot be
# ported as Java at all -- their boxes have to become JSON. Converting them from the archive is both
# the only way to get the geometry and the only way to keep it out of this repository.
#
# --- Bone names, and why they are single letters --------------------------------------------------
# Unlike Mo' Creatures, whose model classes name their own fields, Twilight Forest's models write
# into fields they INHERIT from Minecraft's own ModelQuadruped -- and in b1.7.3 those are obfuscated.
# So the archive's field names for the six base boxes are the single letters d, e, f, g, h and i, and
# the aliases below are what turn them back into something BTA's renderers can ask for.
#
# The mapping is read off the rotation points rather than guessed, since a letter carries no meaning:
#
#   d  head      built at (0, 12, -6) -- the only box in front of the body
#   e  body      built at (0, 11, 2) with rotX = 90 degrees, ModelQuadruped's spine
#   f  leg0      (-3, 18,  7)  back left
#   g  leg1      ( 3, 18,  7)  back right
#   h  leg2      (-3, 18, -5)  front left
#   i  leg3      ( 3, 18, -5)  front right
#
# leg0..leg3 is the order BTA's own MobRendererPig poses: leg0 and leg3 swing together against leg1
# and leg2, which is ModelQuadruped's leg1/leg4 against leg2/leg3. Same animation, same pairing.
#
# --- base = - ------------------------------------------------------------------------------------
# Every Twilight Forest model builds all six of its own boxes in its constructor rather than
# inheriting ModelQuadruped's, so there is no base layer to reconstruct from outside the archive.
# That is what 'base = -' means; do not set it to 'quadruped' here or the six boxes land twice.

# --- The wild boar --------------------------------------------------------------------------------
# A pig with a snout and two tusks. The three extra boxes are the model's own named fields, and all
# three are parented to the head so that posing the head carries them -- the original has no
# hierarchy and re-copies the head's angles onto them by hand every frame, which is the same thing
# said the long way.
boar.source   = ModelTwilightBoar
boar.base     = -
boar.textures = wildboar.png = assets/twilightforest/textures/entity/wildboar.png
boar.bones    = d = head, e = body, f = leg0, g = leg1, h = leg2, i = leg3, \
                snout = snout@head, tusk1 = tusk1@head, tusk2 = tusk2@head

# --- The bighorn sheep ----------------------------------------------------------------------------
# Two geometries, exactly as BTA's own sheep has two: the body and the fleece drawn over it.
# ModelBighornFur is a separate class rather than an overlay pass -- it is the same six boxes at a
# larger inflate (0.6 head, 0.5 body, 0.4 legs) -- so it converts as its own geometry and the
# renderer draws it as layer 2, which is where MobRendererSheep looks for "wool".
#
# The ten horn segments all copy the head's angles every frame in the original's pose method
# (horn1a..horn2e each do `.rotationPointY = head.rotationPointY` and the same for X), which is what
# `@head` says declaratively.
bighorn.source   = ModelTwilightBighorn
bighorn.base     = -
bighorn.textures = bighorn.png = assets/twilightforest/textures/entity/bighorn.png
bighorn.bones    = d = head, e = body, f = leg0, g = leg1, h = leg2, i = leg3, \
                   horn1a = horn1a@head, horn1b = horn1b@head, horn1c = horn1c@head, \
                   horn1d = horn1d@head, horn1e = horn1e@head, \
                   horn2a = horn2a@head, horn2b = horn2b@head, horn2c = horn2c@head, \
                   horn2d = horn2d@head, horn2e = horn2e@head

bighorn_fur.source   = ModelBighornFur
bighorn_fur.base     = -
bighorn_fur.textures = bighorn.png = assets/twilightforest/textures/entity/bighorn.png
bighorn_fur.bones    = d = head, e = body, f = leg0, g = leg1, h = leg2, i = leg3

# --- The wild deer --------------------------------------------------------------------------------
# The tallest mob in the mod at 2.3 blocks, and the largest model of the four: twenty-two antler
# segments (horn1a-k and horn2a-k), a nose and a neck on top of the quadruped six.
#
# The antlers and the nose copy the head's angles every frame, so they are head-parented.
#
# ⚠️ The NECK is deliberately NOT parented. Unlike everything else here it does not track the head --
# the original assigns it a fixed `rotateAngleX = 0.2443461F` (14 degrees) in the pose method and
# never touches it again. Hanging it off the head would make a deer's neck swing when it looks
# around, which the original's does not do. Left standalone, it keeps the constant tilt it is drawn
# with.
deer.source   = ModelTwilightDeer
deer.base     = -
deer.textures = wilddeer.png = assets/twilightforest/textures/entity/wilddeer.png
deer.bones    = d = head, e = body, f = leg0, g = leg1, h = leg2, i = leg3, \
                neck = neck, nose = nose@head, \
                horn1a = horn1a@head, horn1b = horn1b@head, horn1c = horn1c@head, \
                horn1d = horn1d@head, horn1e = horn1e@head, horn1f = horn1f@head, \
                horn1g = horn1g@head, horn1h = horn1h@head, horn1i = horn1i@head, \
                horn1j = horn1j@head, horn1k = horn1k@head, \
                horn2a = horn2a@head, horn2b = horn2b@head, horn2c = horn2c@head, \
                horn2d = horn2d@head, horn2e = horn2e@head, horn2f = horn2f@head, \
                horn2g = horn2g@head, horn2h = horn2h@head, horn2i = horn2i@head, \
                horn2j = horn2j@head, horn2k = horn2k@head
