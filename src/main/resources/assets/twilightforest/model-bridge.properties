# Model bridge manifest.
#
# Maps an entity model class inside a player-supplied copy of Benimatic's Twilight Forest onto the
# Bedrock geometry this mod loads. Matching is on the class's base name only and is
# case-insensitive, so the layout inside the archive does not matter.
#
# ⚠️ That base-name match is what let the donor change from 1.7.1 to 1.15.4 for free. 1.7.1 dumped
# every class in the archive root; 1.15.4 packages them properly, so ModelTFBoar moved from
# `ModelTFBoar.class` to `twilightforest/client/model/ModelTFBoar.class`. Path-based matching would
# have found nothing, silently, and every mob would have gone back to Dragonfly's fallback shape.
#
# This mod ships none of the original's geometry. The bridge reads a copy the player already has on
# disk and writes the converted result into their generated texture pack. See docs/asset-bridge.md
# for the key format and the transform.
#
# --- Why this is needed at all --------------------------------------------------------------------
# BTA 8.0 removed the classic ModelBase / ModelRenderer system entirely; entity models are Dragonfly
# StaticEntityModel loaded from Bedrock JSON geometry. So the original's model classes cannot be
# ported as Java at all -- their boxes have to become JSON. Converting them from the archive is both
# the only way to get the geometry and the only way to keep it out of this repository.
#
# --- ⚠️ 1.7.1 targets Minecraft 1.2.3, not Beta 1.7.3 ---------------------------------------------
# The model API differs, and every difference is silent rather than loud:
#
#   ModelRenderer(ModelBase, u, v)   three arguments, not two
#   addBox(...) returns the renderer  b1.7.3 returned void, so full-descriptor matching finds nothing
#   addChild(ModelRenderer)           real hierarchies; b1.7.3's models had none
#   setTextureOffset / setTextureSize both (int,int) returning the renderer -- see renderer-method
#   addBox(String name, ...)          a named variant that leads with a per-box lookup key
#
# --- Field and method names in the archive --------------------------------------------------------
# Read out of Minecraft 1.2.3's own ModelRenderer, not guessed:
#
#   c d e  rotation point x y z
#   f g h  rotation angle x y z
#   i      mirror
#
# ✅ STILL CORRECT UNDER THE 1.15.4 DONOR, which is Minecraft 1.4.7 -- and this was the one thing in
# the whole donor swap expected to break. It did not, and the reason is worth knowing: Minecraft's
# obfuscator renames CLASSES freely between versions but numbers MEMBERS per class, so a class whose
# shape does not change keeps its member names even as its own name churns. ModelTFBoar is the proof
# -- 1.7.1 has `extends kc` with `new ql(this, 0, 0)`, 1.15.4 has `extends axe` with
# `new ayf(this, 0, 0)`, and every field and method around them (`a`..`g`, `a(...)`, `this.b.f`) is
# identical.
#
# ⚠️ So these mappings are member names, NOT class names, and that is why they survived. Anything
# below keyed on a CLASS name would not have. If a future donor moves further -- 1.5+, where the
# model classes were reshaped -- re-resolve rather than assuming this held twice.
#
# ⚠️ The texture DESTINATIONS below must match asset-bridge.properties exactly -- the geometry bridge
# writes the skin alongside the geometry so a half-written pack cannot pair one mob's boxes with
# another's art, which means both manifests write the same file and the last one wins. Entity skins
# live in a per-entity DIRECTORY as <name>/0.png; see the long note in asset-bridge.properties for
# where that path comes from.
#
# a(int,int) is setTextureOffset and b(int,int) is setTextureSize. They cannot be told apart by
# descriptor, and reading one as the other moves every box on the bone to a different part of the
# atlas, so both are named here rather than guessed.
#
# --- Naming a bone the model built in a loop -------------------------------------------------------
# A `bones` entry keys on the FIELD the original assigned the ModelRenderer to. A model that keeps its
# bones in an array instead gets slots of the form `field[index]` -- `segments[0]`, `segments[1]`, ...
# -- and those can be renamed one at a time or, because there is usually no reason to treat one
# element differently from another, all at once with the wildcard form:
#
#   segments[*] = -
#
# ⚠️ Meant for DROPPING. Mapping a wildcard to a name gives every element of the array the same output
# bone name, which is not something any consumer of this geometry wants. The Questing Ram is the only
# entry that uses it; the note on that entry says why its sixteen segments have to go.

renderer.point-x  = c
renderer.point-y  = d
renderer.point-z  = e
renderer.rotate-x = f
renderer.rotate-y = g
renderer.rotate-z = h
renderer.mirror   = i

renderer-method.a = texture-offset
renderer-method.b = texture-size

# --- Base layers ----------------------------------------------------------------------------------
# The field slots each reconstructed base layer fills, in the order the reconstruction emits them.
# These are Minecraft's own classes, whose boxes are not in the archive, so they are rebuilt from the
# Bedrock geometry BTA already ships and the subclass's boxes are composed on top.
#
# ⚠️ These letters are 1.2.3's and are NOT the ones the 1.p4 port used. In Beta 1.7.3
# ModelQuadruped's six fields are d-i; in 1.2.3 they are a-f. Carrying the old letters across leaves
# every base box unmatched, so the subclass's boxes are appended instead of replacing -- a mob with
# two heads and twelve legs.

base.quadruped.slots  = a, b, c, d, e, f
base.sheep_body.slots = a, b, c, d, e, f
base.sheep_wool.slots = a, b, c, d, e, f
# ⚠️ THE LAST TWO LETTERS ARE 1.4.7's AND ARE NOT 1.2.3's. ModelBiped's two LEG slots are `n, o`
# under Minecraft 1.2.3 and `h, i` under 1.4.7 -- measured by diffing the same model class across
# both archives:
#
#     ModelTFRedcap   1.7.1: c d e f g n o     1.15.4: c d e f g h i
#     ModelTFLich     1.7.1: e f g d c n o     1.15.4: e f g d c h i
#
# The donor swap moved every bridged biped onto 1.4.7 and left these at `n, o`, which matched
# nothing -- so the redcap, the skeleton druid, the wraith and the Lich each had their two leg boxes
# APPENDED to the base instead of replacing its legs. Four-legged humanoids, exactly the failure the
# note above this block describes.
#
# It was missed because the swap was verified against ModelTFBoar, a QUADRUPED, whose slots are a-f
# in both versions. Members do survive a version change when a class's shape does not move -- but
# ModelBiped's did, and one sample of one shape was not evidence about the others. Check one model
# per BASE next time, not one model.
#
# ⚠️ This line is what fixes the legs; the four `bones` lines below it are not. `merge` pairs a
# model's own box with a base box by SLOT, so once this array says `h, i` the replacement happens
# whatever the per-model mapping says. That is why the four bipeds went on carrying `n = legRight,
# o = legLeft` for two revisions after the fix and still rendered correctly -- those entries matched
# no field in the 1.4.7 archive and were silently ignored, while the names came from the base layer.
# They have now been corrected to `h, i` as well, because a manifest that documents a fix it only
# half applied is how the next person concludes h/i are unhandled.
base.biped.slots      = c, d, e, f, g, h, i
base.skeleton.slots   = c, d, e, f, g, h, i
base.spider.slots     = a, b, c, d, e, f, g, n, o, p, q

# ==================================================================================================
# The models
# ==================================================================================================

# --- The wild boar --------------------------------------------------------------------------------
# A quadruped with a shortened body and a snout built as three extra CUBES on the head bone rather
# than as bones of their own -- so there is nothing to reparent, and the snout follows the head for
# free.
wildboar.source   = ModelTFBoar
# No "args" key, deliberately. The 6 and the 12 that set the leg length reach the base layer
# through the super() call, which the reader already records. The args key is for a model whose own
# RENDERER hands it constructor arguments; naming it here makes the reader hunt for a two-argument
# constructor these classes do not have, and the model is skipped outright.
wildboar.base     = quadruped
wildboar.textures = wildboar.png = assets/twilightforest/textures/entity/wildboar/0.png
wildboar.bones    = a = head, b = body, c = leg0, d = leg1, e = leg2, f = leg3

# --- The bighorn sheep ----------------------------------------------------------------------------
# Two geometries, exactly as BTA's own sheep has two: the body and the fleece drawn over it.
#
# ⚠️ The two class names are the wrong way round, and it matters. ModelTFBighorn extends the sheep
# WOOL class and then replaces all six boxes at inflate 0 -- so it is the body. ModelTFBighornFur
# extends the sheep BODY class and rebuilds at inflate 0.6 / 0.5 / 0.4 -- so it is the fleece. Each
# entry names the base its class actually extends; both replace every slot, so the base contributes
# nothing but is kept correct rather than left to chance.
#
# Ten horn segments hang off the head as extra cubes on the head bone, like the boar's snout.
bighorn.source   = ModelTFBighorn
bighorn.base     = sheep_wool
bighorn.textures = bighorn.png = assets/twilightforest/textures/entity/bighorn/0.png
bighorn.bones    = a = head, b = body, c = leg0, d = leg1, e = leg2, f = leg3

bighorn_fur.source   = ModelTFBighornFur
bighorn_fur.base     = sheep_body
bighorn_fur.textures = bighorn.png = assets/twilightforest/textures/entity/bighorn/0.png
bighorn_fur.bones    = a = head, b = body, c = leg0, d = leg1, e = leg2, f = leg3

# --- The wild deer --------------------------------------------------------------------------------
# The tallest mob in the mod. Twenty-two antler segments and a nose are extra cubes on the head bone.
#
# The NECK is a real addChild on the body, which the bridge discovers from the constructor -- so its
# rotation point is an offset from the body's and its fixed 4.974 radian tilt composes on the body's
# 90 degree spine rotation, exactly as the original draws it.
wilddeer.source   = ModelTFDeer
wilddeer.base     = quadruped
wilddeer.textures = wilddeer.png = assets/twilightforest/textures/entity/wilddeer/0.png
wilddeer.bones    = a = head, b = body, c = leg0, d = leg1, e = leg2, f = leg3, neck = neck

# --- The penguin ----------------------------------------------------------------------------------
# Self-contained: it extends ModelBase and builds all seven of its own boxes. The beak is a real
# addChild on the head.
penguin.source   = ModelTFPenguin
penguin.base     = -
penguin.textures = penguin.png = assets/twilightforest/textures/entity/penguin/0.png
penguin.bones    = body = body, head = head, beak = beak, \
                   rightarm = wingRight, leftarm = wingLeft, \
                   rightleg = legRight, leftleg = legLeft

# --- The redcap -----------------------------------------------------------------------------------
# A biped whose every box is replaced: a squat 7x7x7 head, a cap where the headwear box goes, and
# three-wide limbs instead of four. The two ears are separate bones that copy the head's angles every
# frame in the pose method, which is what `@head` says declaratively.
redcap.source   = ModelTFRedcap
redcap.base     = biped
redcap.textures = redcap.png = assets/twilightforest/textures/entity/redcap/0.png
#
# ⚠️ `@head` here is CORRECT and is the exception, not the pattern -- see the beetles at the bottom of
# this file, where the same tag was wrong twenty-seven times. ModelTFRedcap creates its two ears and
# never addChilds them; upstream copies the head's angles onto them in the pose method every frame,
# and their rotation points are already absolute. `@head` is the only thing attaching them, and no
# parent offset must be added. The beetles' faces ARE addChilded, so there the tag threw the offset
# away. Check the constructor before copying either line.
redcap.bones    = c = head, d = cap, e = body, f = armRight, g = armLeft, h = legRight, i = legLeft, \
                  goblinRightEar = earRight@head, goblinLeftEar = earLeft@head

# --- The minotaur ---------------------------------------------------------------------------------
# The shortest model class in the archive. ModelTFMinotaur extends ModelBiped, replaces NOTHING, and
# adds five boxes: a snout and two horns of two segments each. All seven biped slots therefore come
# straight from the base layer, which is why every one of them is listed here even though the class
# names none of them -- `merge` pairs by SLOT, and an unlisted slot arrives in the geometry with no
# name for the renderer to find.
#
# ⚠️ NO `@head` tag on any of the five, and this is the case the redcap's note above warns about from
# the other side. The redcap's ears are never addChilded and have absolute rotation points, so `@head`
# is the only thing attaching them. The minotaur's horns and snout ARE addChilded --
# `this.c.a(this.horn1a)`, `this.horn1a.a(this.horn1b)`, `this.c.a(this.snout)` -- so the reader
# discovers the hierarchy itself and their rotation points are already offsets from their parent's.
# Tagging them would add the head's offset a second time and put both horns through the chest.
#
# ⚠️ horn1* is the LEFT horn and horn2* is the RIGHT one, which the numbering does not tell you.
# Read off the rotation points: horn1a sits at x = +4 and horn2a at x = -4, and ModelBiped puts its
# RIGHT arm at x = -5. So negative x is the mob's right. Same trap as the beetles' leg numbering.
#
# The two-segment horns are a real chain -- horn1b is a child of horn1a, not of the head -- so the
# outer segment's 30 degree kick composes on the inner segment's 15 degree splay and the horn curves.
minotaur.source   = ModelTFMinotaur
minotaur.base     = biped
minotaur.textures = minotaur.png = assets/twilightforest/textures/entity/minotaur/0.png
minotaur.bones    = c = head, d = headwear, e = body, f = armRight, g = armLeft, \
                    h = legRight, i = legLeft, \
                    horn1a = hornLeftBase, horn1b = hornLeftTip, \
                    horn2a = hornRightBase, horn2b = hornRightTip, \
                    snout = snout

# --- The Minoshroom -------------------------------------------------------------------------------
# The labyrinth's boss, and a genuine centaur: ModelTFMinoshroom extends ModelBiped, REPLACES four of
# its seven slots (head, body, both arms) with 128x32 boxes of its own, and adds a bull's barrel, four
# legs, udders, two two-segment horns and a snout.
#
# ⚠️ THREE BIPED SLOTS ARE DROPPED WITH `-` AND ALL THREE HAVE TO BE. The model never creates a
# renderer for d, h or i, and upstream's render method lists ten bones -- c, body, leg1..4, udders, e,
# g, f -- with none of those three among them. So the base layer's headwear plate and its two legs
# survive reconstruction at the VANILLA rest position, y = 24 and y = 12, while the Minoshroom's own
# head sits at y = -6. That is the kobold's floating blue strip, three times over: a plate and two
# human legs hanging in the air inside a bull.
#
# ⚠️ h and i are ANIMATED in the pose method (`this.h.f = cos(...)`) and still never drawn. Do not
# read that as evidence they should be kept -- it is ModelBiped's own leg code left running on boxes
# the subclass has stopped rendering.
#
# ⚠️ NO `@head` ON THE HORNS OR THE SNOUT, for the reason the minotaur entry above gives at length:
# ModelTFMinoshroom addChilds all five (`this.c.a(this.horn1a)`, `this.horn1a.a(this.horn1b)`,
# `this.c.a(this.snout)`), so the bridge discovers the hierarchy and their rotation points are already
# offsets. horn1* is the LEFT horn -- horn1a sits at x = +4 -- which the numbering does not tell you.
#
# ✅ THE BARREL AND THE UDDERS NOW ARRIVE WITH THEIR QUARTER TURN. Both are turned on X by
# `this.setRotation(this.body, 1.570796f, 0, 0)` -- a call to a PRIVATE HELPER on the model, not a
# field assignment -- and the reader used to ignore any call whose target was the model rather than a
# bone. Its second chance did not apply either: the rest-pose reader matched (FFFFFF)V and (FFFFFFZ)V,
# and a Minecraft 1.4.7 pose method is (FFFFFFLlq;)V, six floats and a trailing ENTITY. So the rotation
# was lost twice over and TFBossRenderers.Minoshroom re-asserted it every frame.
#
# Both holes are closed in TFGeometryBridge -- it walks a private helper's body like any other
# bytecode, and it recognises the entity-tailed descriptor -- so minoshroom.json carries
# `"rotation": [90, 0, 0]` on `barrel` and `udders` and the renderer line is gone. ⚠️ The descriptor
# half was NOT a Minoshroom-only fault: it switched the rest-pose reader off for every 1.4.7 model in
# the archive.
#
# ⚠️ leg1 is the BACK RIGHT leg. Read off the rotation points, not the numbering: leg1 is at
# (-3, 12, +7) and ModelBiped puts its RIGHT arm at negative x. The renames below put the two
# diagonals on leg0/leg3 and leg1/leg2, which is BTA's own quadruped pairing AND upstream's phases.
minoshroom.source   = ModelTFMinoshroom
minoshroom.base     = biped
minoshroom.uv-size  = 128, 32
minoshroom.textures = minoshroomtaur.png = assets/twilightforest/textures/entity/minoshroomtaur/0.png
minoshroom.bones    = c = head, d = -, e = torso, f = armRight, g = armLeft, h = -, i = -, \
                      body = barrel, udders = udders, \
                      leg1 = leg0, leg2 = leg1, leg3 = leg2, leg4 = leg3, \
                      horn1a = hornLeftBase, horn1b = hornLeftTip, \
                      horn2a = hornRightBase, horn2b = hornRightTip, \
                      snout = snout

# --- The Questing Ram -----------------------------------------------------------------------------
# ✅ THIS ENTRY USED TO FAIL, AND THE FAILURE IS WORTH KEEPING ON THE RECORD, because the shape of it
# is the argument for where a bridge fault gets fixed.
#
# ModelTFQuestRam's constructor opens with an inline `int[] colorOrder = {0, 8, 7, ...}` and ends with
# a counted loop:
#
#     this.segments = new ModelRenderer[16];
#     for (int i = 0; i < 16; ++i) { this.segments[i] = new ModelRenderer(this, 0, 104); ... }
#
# The loop compiles to a backwards `goto` -- offset 1272 -> 1206 in the archive's class file -- and the
# reader used to refuse both: NEWARRAY at offset 7 was an instruction it could not follow, and
# `branch()` reported "constructor jumps backwards, which this cannot follow" if you got past it.
#
# ⚠️ THE DAMAGE WAS ALL-OR-NOTHING, WHICH IS THE PART TO REMEMBER. Any extraction problem skips the
# WHOLE model, so the ram lost not merely its sixteen segments but its body, its legs, its neck and its
# head, and rendered as Dragonfly's fallback cube. A mob that is ninety percent readable produced
# nothing at all.
#
# The fix went into TFGeometryBridge, not here: the reader tracks arrays element by element, follows a
# backwards jump and unrolls the loop by walking it, and `run()`'s instruction budget now REPORTS when
# it is exhausted rather than returning a half-built model quietly. This entry was written out in full
# while it was still failing and needed only the `segments[*] = -` line below.
#
# ⚠️ SHIPPING A HAND-WRITTEN questram.json WAS NEVER THE ANSWER, and it is worth saying why, because
# it is what was done for the mosquito swarm and the tower golem. Those two are legitimate: the swarm's
# boxes are derived from THIS PORT'S hitbox because upstream builds them from an unseeded Random and
# there are no authored coordinates to recover, and the golem and the termite are transcribed from
# MINECRAFT'S own model classes. The ram's boxes are Benimatic's, authored, and recoverable -- putting
# them in this repository is exactly what the bridge exists to prevent.
#
# ⚠️ The `segments` array IS extracted now and is dropped on purpose -- `segments[*] = -` below, the
# wildcard form for an array-held slot. Sixteen identical 18x15x2 slabs at ONE rotation point whose
# only difference is a per-bone glColor3f, and Dragonfly's BoneTransform carries position, rotation,
# scale and visibility but NO colour. Emitted, they would stack untinted in the same place and read as
# a grey plank through the ram's rear. See TFBossRenderers.QuestRam.
#
# ⚠️ The head and both horns are NAMED boxes -- `this.head.addBox("horn1a", ...)` -- whose texture
# offsets come from the fifteen `this.setTextureOffset("head.horn1a", 0, 94)` calls at the top of the
# constructor, NOT from the bone. The reader follows that table; before it did, all fifteen boxes
# sampled (0, 0) and the ram's face was painted with its own flank. The bunny's and the squirrel's ears
# are the same trick and were the same wrong.
#
# ⚠️ 128x128. The constructor opens `textureWidth = 128; textureHeight = 128`, and the model calls
# `this.nose.setTextureSize(128, 128)` again on one bone -- agreeing, so it changes nothing, unlike
# the slime beetle's disagreeing call further down this file.
#
# ⚠️ `base = -`: ModelTFQuestRam extends ModelBase directly and builds every box itself. There is no
# vanilla layer under it and naming one would compose boxes it never had.
#
# The nose is a real addChild on the head, so the bridge discovers it -- no `@head`.
#
# leg1/haunch1 are at (-6, 2, +13), i.e. BACK RIGHT; leg3/haunch3 at (-6, 1, -8), FRONT RIGHT. The
# renames put upstream's two phase groups (leg1+leg4 against leg2+leg3) onto BTA's leg0+leg3 against
# leg1+leg2, which is the same diagonal gait under different names.
questram.source   = ModelTFQuestRam
questram.base     = -
questram.uv-size  = 128, 128
questram.textures = questram.png = assets/twilightforest/textures/entity/questram/0.png
questram.bones    = frontbody = bodyFront, rearbody = bodyRear, neck = neck, head = head, nose = nose, \
                    leg1 = leg0, haunch1 = haunch0, leg2 = leg1, haunch2 = haunch1, \
                    leg3 = leg2, haunch3 = haunch2, leg4 = leg3, haunch4 = haunch3, \
                    segments[*] = -

# --- The skeleton druid ---------------------------------------------------------------------------
# A skeleton with a wider body, thicker arms and a dress -- an extra box hanging below the waist that
# is what makes it read as a druid rather than as a skeleton holding a hoe.
skeletondruid.source   = ModelTFSkeletonDruid
skeletondruid.base     = skeleton
skeletondruid.textures = skeletondruid.png = assets/twilightforest/textures/entity/skeletondruid/0.png
skeletondruid.bones    = c = head, d = headwear, e = body, f = armRight, g = armLeft, \
                         h = legRight, i = legLeft, dress = dress

# --- The twilight wraith --------------------------------------------------------------------------
# A zombie that adds nothing but the same dress. The zombie layer changes only the pose -- arms held
# out in front -- so its boxes are the biped's, which is why the base is `biped` and not a layer of
# its own.
#
# ⚠️ Its texture is ghost-crown.png, not wraith.png. Both are in the archive; EntityTFWraith names
# the crowned one and nothing loads the other.
wraith.source   = ModelTFWraith
wraith.base     = biped
wraith.textures = ghost-crown.png = assets/twilightforest/textures/entity/ghost-crown/0.png
wraith.bones    = c = head, d = headwear, e = body, f = armRight, g = armLeft, \
                  h = legRight, i = legLeft, dress = dress

# --- The Twilight Lich ----------------------------------------------------------------------------
# A biped with a 64x64 skin, a wider head (the +0.5 box grow on the headwear slot is upstream's), and
# two flat plates the base does not have: a collar behind the shoulders and a cloak down the back.
#
# ⚠️ Its base is `biped`, not `skeleton`, even though it is plainly a skeleton: ModelTFLich extends
# ModelZombie, whose boxes ARE the biped's. The skeleton layer has thinner arms and legs, and using
# it here would give the Lich a skeleton's build under a robe drawn for a zombie's.
#
# ⚠️ The collar and cloak are siblings, not children. Upstream renders them at 1.125x the body's
# scale and never rotates them with anything, so parenting them to the body would make them swing
# when it walks. See TFHumanoidRenderers.Lich for the scale difference that cannot be carried.
#
# ⚠️ `shieldBelt = -` drops a bone that has NO BOXES, and it still has to be said. ModelTFLich builds
# it with the one-argument constructor -- `new ayf(this)` -- and never gives it a cube; the shields
# are created in the animation method, one per point of shield strength, at runtime. An unmapped bone
# is emitted under its own field name rather than skipped, so leaving it out put an empty
# `shieldBelt` in the geometry. Harmless to look at and misleading to read, which is the same reason
# the swarm spider and ModelTFTinyFirefly are written down as deliberate omissions rather than left
# absent.
#
# ⚠️ 64x64, AND THE `base = biped` ABOVE DOES NOT ARGUE AGAINST IT. A biped base layer is 64x32, so a
# model that composes one usually is too -- but ModelTFLich sets `textureWidth/Height = 64` and then
# REPLACES all seven inherited slots (c, d, e, f, g, h, i) with new ModelRenderers of its own. Not one
# 64x32 box survives composition, so the whole thing is measured in a 64-wide, 64-TALL atlas, which is
# what twilightlich64.png is. Left at the 64x32 default every v doubled: the body, offset v=16 and 24
# tall, ran off the bottom of the texture entirely.
lich.source   = ModelTFLich
lich.base     = biped
lich.uv-size  = 64, 64
lich.textures = twilightlich64.png = assets/twilightforest/textures/entity/twilightlich64/0.png
lich.bones    = c = head, d = headwear, e = body, f = armRight, g = armLeft, \
                h = legRight, i = legLeft, collar = collar, cloak = cloak, shieldBelt = -

# --- Not bridged: the firefly spark ---------------------------------------------------------------
# ModelTFTinyFirefly is a single 10x10x0 box and nothing else -- zero depth, so a quad rather than a
# cube. RendererTFTinyFirefly emits it directly, because a StaticEntityModel cannot carry the
# per-frame alpha the glow needs -- so there is no geometry to convert. Its texture IS bridged; see
# asset-bridge.properties.
#
# ⚠️ 10x10x0 IS 1.15.4'S. 1.7.1's is `new ModelRenderer(this, 18, -1)` with addBox(..., 10, 10, 1) --
# depth ONE, a real box with six faces. Both donors are in _reference and this port follows 1.15.4,
# which is the version that flattened it.
#
# ⚠️ AND THE SPRITE IS NOT AT THE MODEL'S TEXTURE OFFSET. A zero-depth box keeps TWO coplanar faces,
# front at u 20..30 and back at u 30..40, and the art is on the back one -- 20..30 is 22% covered
# against 30..40's 100%. That blob is the FLOATING firefly and nothing else; the bug on the tree is
# the left of the same sheet, which is what the three bones below unwrap onto. See
# RendererTFTinyFirefly, which samples 30..40.

# --- The Naga -------------------------------------------------------------------------------------
# One class, two geometries, because one class draws two entities: ModelTFNaga builds a head cube and
# a body cube and its render method picks whichever the entity is. Splitting it here is what lets the
# head and the body carry their own skins, which is how the original draws them -- RenderTFNaga binds
# nagahead.png or nagasegment.png per entity.
#
# Each entry drops the other's bone with `-`, so neither geometry carries a cube it never draws.
naga.source   = ModelTFNaga
naga.base     = -
naga.textures = nagahead.png = assets/twilightforest/textures/entity/nagahead/0.png
naga.bones    = head = head, body = -

nagasegment.source   = ModelTFNaga
nagasegment.base     = -
nagasegment.textures = nagasegment.png = assets/twilightforest/textures/entity/nagasegment/0.png
nagasegment.bones    = head = -, body = body

# --- The critters ---------------------------------------------------------------------------------
# The firefly and the cicada are BLOCKS with tile entities, not mobs, so these two geometries are
# drawn by TileEntityRendererTFFirefly and TileEntityRendererTFCicada rather than by a MobRenderer.
# Both models extend ModelBase directly and build every box themselves, so neither takes a base.
#
# ⚠️ Both bind firefly-tiny.png / cicada-model.png as LITERAL paths -- the renderers name the file
# rather than looking one up per entity -- which is why those two skins are bridged flat rather than
# into an `entity/<name>/0.png` slot like a mob's.
#
# The two share three of their four boxes at identical coordinates: `legs` is a wide flat plate,
# `fatbody` the abdomen and `skinnybody` the thorax. The cicada adds two eyes and a wing plate; the
# firefly adds `glow`, the lit underside that makes it the dimension's ambient lighting. The eye
# boxes are bridged under left/right names rather than upstream's eye1/eye2 because nothing in the
# original says which is which, and a name that states the side is worth more than one that matches
# the field.
firefly.source   = ModelTFFirefly
firefly.base     = -
firefly.textures = firefly-tiny.png = assets/twilightforest/textures/entity/firefly-tiny.png
#
# ⚠️ `glow` IS DROPPED WITH `-`, and it is the one bone here that must be. Upstream declares it and
# sizes it and then never draws it:
#
#     public void render(float f5) {
#        this.legs.a(f5);  this.fatbody.a(f5);  this.skinnybody.a(f5);
#     }
#
# It is a 10x1x10 plate -- most of a block wide -- so bridging it gives every firefly in the world a
# huge flat green square hanging off it. Reported from play as exactly that. The lit look it is
# named for comes from TileEntityRendererTFFirefly's additive second pass, not from a box.
firefly.bones    = legs = legs, fatbody = fatbody, skinnybody = skinnybody, glow = -

cicada.source   = ModelTFCicada
cicada.base     = -
cicada.textures = cicada-model.png = assets/twilightforest/textures/entity/cicada-model.png
cicada.bones    = legs = legs, fatbody = fatbody, skinnybody = skinnybody, \
                  eye1 = eyeRight, eye2 = eyeLeft, wings = wings

# --- Not bridged, deliberately --------------------------------------------------------------------
# The swarm spider and the hedge spider have no geometry of their own. ModelTFSwarmSpider adds
# nothing to Minecraft's ModelSpider but a 0.5 render scale, and the hedge spider has no model class
# at all. Both draw on BTA's own spider geometry with a bridged skin, so there is nothing to convert.
#
# ModelTFTinyFirefly is also left out, and that is not an oversight either: in 1.15.4 it is a SINGLE
# 10x10x0 box, i.e. already a quad. RendererTFTinyFirefly builds it by hand so it can be camera-facing
# and carry a per-frame alpha, neither of which a converted model can be. See that class.
#
# The Hydra is left out until its entity exists.

# --- The ambient four, from the 1.15.4 donor ------------------------------------------------------
# All four extend ModelBase directly rather than one of Minecraft's model classes, so `base = -`:
# every box is theirs and none has to be completed from vanilla geometry. Their bone FIELDS carry
# real names rather than obfuscated letters, because these classes were compiled from source that
# still had them -- so the left-hand side below reads like English where the older mobs' does not.
#
# ⚠️ The texture named is variant 0's. The other variants are bridged by asset-bridge.properties and
# resolved at runtime by Mob.setSkinVariant; the geometry lane only needs one so the pack is never
# written with geometry and no skin at all.
#
# ⚠️ ALL FOUR ARE 32x32, AND uv-size IS THE ONLY PLACE THAT CAN SAY SO. Each of these classes opens
# its constructor with `this.textureWidth = 32; this.textureHeight = 32;` before it builds a single
# box, so every texture offset in them is measured in a 32-wide atlas. This file's default is
# ModelBase's own 64x32, which is right for most of the archive and wrong for exactly these four --
# and the failure is silent, because a Bedrock UV is a fraction of the DECLARED size. Declaring 64
# against 32-wide art halves every u: each box samples the left half of the region it was painted
# for, stretched back to full width. Reported from play as the birds looking mangled, and it is the
# whole model, not one bone.
#
# There is no way to infer this from the art either -- the PNG is 32x32, but so is a 32x32 file
# holding double-resolution 16x16 UVs, which is why uvWidth/uvHeight are read from here and never
# from the image. What the bridge DOES check is the per-bone setTextureSize the same constructors
# call: if a bone disagrees with the number below, it says so in the audit rather than shipping it.

bunny.source   = ModelTFBunny
bunny.base     = -
bunny.uv-size  = 32, 32
bunny.textures = bunnydutch.png = assets/twilightforest/textures/entity/bunny/0.png
bunny.bones    = head = head, body = body, tail = tail,                  leg1 = legFrontRight, leg2 = legFrontLeft, leg3 = legBackRight, leg4 = legBackLeft

squirrel.source   = ModelTFSquirrel
squirrel.base     = -
squirrel.uv-size  = 32, 32
squirrel.textures = squirrel2.png = assets/twilightforest/textures/entity/squirrel/0.png
# The three `fluff` boxes are the tail's plume -- upstream draws the tail as a stack of four rather
# than one long box, which is what lets it curl.
squirrel.bones    = head = head, body = body, tail = tail,                     leg1 = legFrontRight, leg2 = legFrontLeft, leg3 = legBackRight,                     leg4 = legBackLeft, fluff1 = tailFluff1, fluff2 = tailFluff2,                     fluff3 = tailFluff3

tinybird.source   = ModelTFTinyBird
tinybird.base     = -
tinybird.uv-size  = 32, 32
tinybird.textures = tinybirdbrown.png = assets/twilightforest/textures/entity/tinybird/0.png
tinybird.bones    = head = head, beak = beak, body = body, tail = tail,                     rightarm = wingRight, leftarm = wingLeft,                     rightleg = legRight, leftleg = legLeft

raven.source   = ModelTFRaven
raven.base     = -
raven.uv-size  = 32, 32
raven.textures = raven.png = assets/twilightforest/textures/entity/raven/0.png
# ⚠️ TWO beak boxes and TWO foot boxes, where the tiny bird has one beak and no feet. A raven's beak
# opens, which is why it is split; naming both to one bone would weld it shut.
raven.bones    = head = head, beak1 = beakUpper, beak2 = beakLower, body = body, tail = tail,                  rightarm = wingRight, leftarm = wingLeft,                  rightleg = legRight, rightfoot = footRight,                  leftleg = legLeft, leftfoot = footLeft

# --- The small hostiles, from the 1.15.4 donor ----------------------------------------------------
# ⚠️ The kobold is the only BIPED added since the donor swap, and it is the reason the biped slot
# letters above were re-resolved: it names c, e, f, g, h and i, and `h`/`i` are 1.4.7's leg slots
# where 1.2.3 used n/o. If those two are ever wrong again, this mob grows a second pair of legs
# before any of the older ones visibly do, because it assigns them directly.
kobold.source   = ModelTFKobold
kobold.base     = biped
kobold.textures = kobold.png = assets/twilightforest/textures/entity/kobold/0.png
#
# ⚠️ NO @head ON THE EARS, SNOUT OR JAW, and the redcap three entries up DOES use it. The difference
# is in the archive, not in taste: ModelTFKobold calls `this.c.a(this.rightear)` -- a real addChild --
# for all four, and the bridge discovers addChild from the constructor by itself. Writing `@head` as
# well applies the head's rotation point a SECOND time, which lifted the ears and snout thirteen
# units off the model and left them hanging in the air above it. Reported from play, and the
# screenshot is unmistakable.
#
# ModelTFRedcap creates its two ears and never addChilds them, so there `@head` is the only thing
# attaching them. Same-looking mobs, opposite manifests. Check the constructor before copying either.
#
# ⚠️ `d = -` DROPS THE HEADWEAR, and leaving it out is not the same as dropping it. Slot d is the
# biped base's headwear plate, and ModelTFKobold never assigns it -- so with no entry the base's own
# box survives reconstruction at its VANILLA rest position, y=24, while the kobold has moved its head
# down to y=12. The result is a flat plate wearing the kobold's skin floating twelve units above it.
# Reported from play as a blue strip in the air over the mob.
#
# Every other biped here names d because its model assigns d (the redcap's cap, the others'
# headwear). The kobold is the only one that does not, so it is the only one that must say so.
kobold.bones    = c = head, d = -, e = body, f = armRight, g = armLeft, h = legRight, i = legLeft,                   rightear = earRight, leftear = earLeft, snout = snout, jaw = jaw

# The three beetles share a body plan: a thorax, a rear end, six legs, a head with antennae and eyes.
# Bone names are upstream's own -- these classes kept their source names -- so the mapping is nearly
# identity, and the capitalisation is upstream's too.
#
# ⚠️ NO `@head` ON ANY OF THESE, and all three used to carry it on every face bone. All three classes
# end their constructors with real addChild calls -- `this.head.a(this.eye1)` and fourteen more -- so
# the bridge finds the hierarchy by itself, exactly as it does for the kobold, the raven and the
# squirrel. Writing `@parent` as well does not reinforce that; it REPLACES it, and the two mean
# opposite things about coordinates:
#
#   discovered addChild  -> the child's rotation point is an OFFSET from its parent's, so the bridge
#                           adds the parent's point to get Bedrock's absolute pivot
#   manifest @parent     -> the child is drawn about its OWN point in model space and the parenting is
#                           faked per frame by copying angles, so no offset is added
#
# Tagging a real addChild therefore drops the parent offset on the floor. Measured on the built pack
# before the fix -- ModelTFFireBeetle, head at rotation point (0, 19, -5):
#
#     eye1 correct   (0,19,-5) + (-3,-2,-5) = (-3, 17, -10)  ->  pivot [-3,  7, -10]
#     eye1 as built                                              pivot [-3, 26,  -5]
#
# Nineteen units up and five forward, on every eye, antenna, jaw and tooth of all three beetles. The
# mobs wore their faces above and in front of their heads. The redcap two entries up is the one place
# `@head` is RIGHT, because ModelTFRedcap never addChilds its ears -- read the constructor, not the
# neighbouring line.
#
# ⚠️ Removing the tags also fixes a hierarchy that was wrong in its own right. `jaw1b` is a child of
# `jaw1a`, not of the head, and the pinch beetle's teeth hang off `jaw1b`/`jaw2b` three levels down.
# Naming them all `@head` flattened that, so the pincers would not have swung with the jaw even if
# they had been in the right place.
firebeetle.source   = ModelTFFireBeetle
firebeetle.base     = -
firebeetle.textures = firebeetle.png = assets/twilightforest/textures/entity/firebeetle/0.png
firebeetle.bones    = head = head, thorax = thorax, RearEnd = rearEnd, \
                      connector1 = connector1, connector2 = connector2, \
                      Leg1 = leg1, Leg2 = leg2, Leg3 = leg3, Leg4 = leg4, Leg5 = leg5, Leg6 = leg6, \
                      jaw1a = jaw1a, jaw1b = jaw1b, jaw2a = jaw2a, jaw2b = jaw2b, \
                      antenna1 = antenna1, antenna2 = antenna2, \
                      eye1 = eye1, eye2 = eye2

# ⚠️ 64x64, AND THE MODEL ITSELF SAYS 64x32 IN ONE PLACE -- ignore that one. The constructor opens
# with `textureWidth = 64; textureHeight = 64;`, which is what every box is then built against, and
# only afterwards calls `this.Leg1.setTextureSize(64, 32)`. That call lands AFTER Leg1's addBox, and a
# Java box freezes its UVs at addBox time, so it changes nothing in the original and must change
# nothing here. slimebeetle.png is 64x64. The other two beetles really are 64x32 and say so
# themselves, which is why this is the only beetle carrying the key.
slimebeetle.source   = ModelTFSlimeBeetle
slimebeetle.base     = -
slimebeetle.uv-size  = 64, 64
slimebeetle.textures = slimebeetle.png = assets/twilightforest/textures/entity/slimebeetle/0.png
# `slimeCenter` is the blob it carries on its back -- the ammunition for the ranged attack that is not
# ported. It stays: it is part of the silhouette whether or not it ever throws one, and a beetle
# missing its slime reads as a different mob.
#
# ⚠️ `slimeCube` IS DROPPED, and it is the same mistake as the firefly's `glow` two screens up -- the
# BOX LIST is not the DRAW LIST. The constructor ends:
#
#     if (this.renderPassModel) { this.tail2.a(this.slimeCube); }
#     else                      { this.tail2.a(this.slimeCenter); }
#
# and `ModelTFSlimeBeetle()` delegates to `this(false)`. So the ordinary model attaches slimeCenter
# (8x8x8) and NEVER slimeCube (12x12x12); slimeCube belongs to the translucent second pass, and the
# render method draws it only when renderPassModel is set. Bridging it put a twelve-cube block in the
# OPAQUE pass -- and because its one addChild sits in a branch that never runs, it came out
# unparented as well, at pivot [0, 30, 0]: a solid slab hanging two blocks above the beetle rather
# than sitting on its back. An earlier revision of this comment argued it was "part of the
# silhouette". It is part of a silhouette upstream draws see-through, over the top of the one below.
slimebeetle.bones    = head = head, RearEnd = rearEnd, connector1 = connector1, \
                       Leg1 = leg1, Leg2 = leg2, Leg3 = leg3, Leg4 = leg4, Leg5 = leg5, Leg6 = leg6, \
                       antenna1 = antenna1, antenna2 = antenna2, \
                       eye1 = eye1, eye2 = eye2, mouth = mouth, \
                       tail1 = tail1, tail2 = tail2, \
                       slimeCube = -, slimeCenter = slimeCenter

pinchbeetle.source   = ModelTFPinchBeetle
pinchbeetle.base     = -
pinchbeetle.textures = pinchbeetle.png = assets/twilightforest/textures/entity/pinchbeetle/0.png
# Six tooth boxes on top of the four jaw boxes -- this is the one that grabs you, and upstream drew
# it the pincers to say so.
#
# ⚠️ The deepest hierarchy in the whole manifest, and every level of it is discovered rather than
# declared: head -> jaw1a -> jaw1b -> tooth1a/1b/1c, and the same again on the other side. The teeth
# sit at rotation points like (9, 0, 0) relative to jaw1b, which is itself at (7, 0, 0) relative to
# jaw1a, which is at (-3, 1, -6) relative to the head. Naming all ten `@head`, as this line used to,
# both flattened the chain and dropped every offset in it.
pinchbeetle.bones    = head = head, thorax = thorax, RearEnd = rearEnd, \
                       connector1 = connector1, connector2 = connector2, \
                       Leg1 = leg1, Leg2 = leg2, Leg3 = leg3, Leg4 = leg4, Leg5 = leg5, Leg6 = leg6, \
                       jaw1a = jaw1a, jaw1b = jaw1b, jaw2a = jaw2a, jaw2b = jaw2b, \
                       tooth1a = tooth1a, tooth1b = tooth1b, tooth1c = tooth1c, \
                       tooth2a = tooth2a, tooth2b = tooth2b, tooth2c = tooth2c, \
                       antenna1 = antenna1, antenna2 = antenna2, \
                       eye1 = eye1, eye2 = eye2

# --- The mosquito swarm is NOT bridged, and it is the only model this mod ships itself -------------
# There was an entry here. It converted cleanly and produced a mob you could not see, and no edit to
# it could ever have done better.
#
# ModelTFMosquitoSwarm's constructor declares seven boxes -- a core and six nodes -- and every one of
# them is 1x1x1. The other ninety-six come from a helper it calls six times:
#
#     public void addBugsToNodes(ayf node) {
#         for (int i = 0; i < 16; ++i) {
#             ayf bug = new ayf(this, rand.nextInt(28), rand.nextInt(28));
#             bug.a(bugX, bugY, bugZ, 1, 1, 1);                     // jitter, from an UNSEEDED Random
#             bug.a((float) vec.c, (float) vec.d, (float) vec.e);   // a point on a ring of radius 11
#             node.a(bug);
#         }
#     }
#
# ⚠️ **93% of this mob is built by a loop in a second method from an unseeded Random.** The reader
# walks constructors and does not unroll loops -- and unrolling would not help, because there are no
# authored coordinates in there to recover. Upstream builds a different cloud every time the model is
# constructed. A perfect converter still yields seven single pixels.
#
# So this one is hand-written: see tools/gen_mosquito_geometry.py, which derives the cloud from this
# port's own hitbox (0.7 x 1.9 at render scale 0.5) rather than from anything in the archive, and
# emits the same 7 bones / 103 boxes upstream ends up with. It is listed in
# TFGeometryBridge.BUILTIN_MODEL_IDS so the generated pack's models.json still names it.
#
# ⚠️ The SKIN is still bridged -- see mosquitoswarm.png in asset-bridge.properties. Only the boxes are
# ours, and that distinction is the whole reason this is acceptable: it stays true that no art from
# the original lives in this repository.
#
# ⚠️ Do not put the entry back to "fix" the mob looking sparse. That is what it looked like WITH the
# entry.

# ⚠️ The redcap sapper has NO geometry entry, deliberately. Upstream gives it no model class of its
# own -- it is a redcap in a different skin -- so it draws on geometry.redcap, which is already
# bridged above, and its skin comes from asset-bridge.properties. Adding an entry here would look for
# a ModelTFRedcapSapper that does not exist and log a miss every launch.

# ⚠️ The maze slime has NO geometry entry either, for the same reason and with one difference worth
# naming: it draws on BTA's OWN slime model rather than on another Twilight Forest model. Upstream
# gives EntityTFMazeSlime no model class -- TFClientProxy registers a renderer for the minotaur and
# none for the slime, and Forge falls back to RenderSlime -- and MobTFMazeSlime extends MobSlime here,
# so BTA's dispatcher falls back to MobRendererSlime the same way. Its SKIN is still bridged; see
# mazeslime.png in asset-bridge.properties.

# --- The dark tower's six, and NOT ONE OF THEM HAS AN ENTRY HERE ----------------------------------
# Four distinct reasons, and they are worth having written down together because the same absence
# means four different things:
#
#   THE THREE GHASTS draw on BTA's OWN geometry.ghast. ⚠️ ModelTFGhast in the archive is Minecraft's
#   ModelGhast character for character -- the same 16-cube body at the same -16 offset, the same nine
#   tentacles built from a Random seeded with the same 1660L, the same lengths. Benimatic copied the
#   vanilla class so he could subclass the RENDERER (to change the scale), not to change the shape.
#   So there is nothing to convert: bridging it would produce a byte-identical copy of a model the
#   game already ships. All three ghasts render with no archive present at all, exactly as the two
#   spiders do. Their three SKINS are bridged; see asset-bridge.properties.
#
#   THE BROODLING draws on geometry.swarmspider, already bridged above -- it is a swarm spider in a
#   different skin, the same position the redcap sapper is in.
#
#   THE GOLEM and THE TERMITE are the new case, and it is the one this manifest cannot serve.
#   ModelTFTowerGolem extends Minecraft's ModelIronGolem and declares NO boxes -- thirteen lines, all
#   animation. The termite has no model class at all; TFClientProxy hands it Minecraft's
#   ModelSilverfish. The base.*.slots machinery exists for precisely this and ⚠️ CANNOT HELP: it
#   rebuilds a vanilla base layer out of the Bedrock geometry BTA already ships, and BTA ships no
#   iron golem and no silverfish. Those mobs do not exist in this game. There is no base to compose
#   against and no subclass boxes to compose.
#
#   So those two geometries are SHIPPED by this mod -- see tools/gen_tower_geometry.py, which
#   transcribes them from Minecraft 1.2.3's own model classes in _reference/mc123/client.jar and
#   documents how the Java-to-Bedrock conversion was verified against a model both engines have.
#   They are listed in TFGeometryBridge.BUILTIN_MODEL_IDS so the generated pack's models.json keeps
#   them. Their SKINS are still bridged; only the boxes are ours, which is the mosquito swarm's split.
#
# ⚠️ Do not add entries for any of the six. Every one would look for a model class that either does
# not exist or has no boxes, and log a miss every launch.
