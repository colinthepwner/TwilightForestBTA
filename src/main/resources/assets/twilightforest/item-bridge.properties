# Item-texture bridge manifest.
#
# The companion to block-bridge.properties, and the same mechanism: Twilight Forest 1.7.1 predates
# Minecraft 1.5, so its item art lives in one `items.png` addressed by tile index, and BTA wants one
# PNG per texture. TFBlockTextureBridge reads both files and does the cutting.
#
#   <archive file name>#<tile index> = <path inside the generated pack>
#
# Reading left to right, top to bottom: column = index & 15, row = index >> 4. The tile SIZE is
# derived from the sheet rather than assumed -- a sheet is 16 tiles across whatever its resolution,
# so tile = width / 16.
#
# --- Why this is a separate file from the blocks -------------------------------------------------
# Not because the cutting differs -- it is identical. Because the DESTINATION differs: BTA stitches
# `block/...` and `item/...` into separate atlases, looked up by separate dispatchers
# (BlockModelDispatcher and ItemModelDispatcher). The two lists feed different pipelines and fail in
# different ways, so they are kept apart.
#
# --- Why there are exactly three lines ------------------------------------------------------------
# Twilight Forest 1.7.1 -- the version being PORTED -- registers exactly one item, the Naga Scale,
# and `TFItems` builds it as
#
#     nagaScale = new ItemTF(idItemNagaScale).setIconIndex(0).setItemName("nagaScale")
#
# so tile 0 was once the whole item roster. Measured against the archive rather than trusted: 1.7.1's
# items.png is 256x256 (tile 16), and tile 0 is the ONLY tile in it with any non-transparent pixel --
# 72 of 256, a small scale-shaped sprite. Every other tile is empty.
#
# ⚠️ The DONOR is 1.15.4, whose items.png is emphatically not empty -- it carries a full armour and
# tool roster for content this port does not have. Tile 0 is still correct for the scale: 1.15.4's
# TFItems also builds it as `.setIconIndex(0)`, verified rather than assumed.
#
# Two more tiles are now bridged, because the port builds the armour the scale has always crafted
# into -- see TFItems and TFRecipes. Their indices are upstream's own, read off the same lines that
# construct the items rather than counted off the sheet by eye:
#
#     plateNaga = new ItemTFNagaArmor(…, ARMOR_NAGA, …, 1).setIconIndex(16).setItemName("plateNaga")
#     legsNaga  = new ItemTFNagaArmor(…, ARMOR_NAGA, …, 2).setIconIndex(32).setItemName("legsNaga")
#
# 16 and 32 are the first tile of rows 1 and 2 (index >> 4 = row), which is how upstream lays a
# material's pieces out -- one row per material, reading helm, plate, legs, boots. The naga has only
# a plate and legs, so its row is short and the boots/helm columns beside these two are empty.
#
# The REST of that sheet is deliberately not bridged: ironwood, steeleaf, fiery, the scepters, the
# maps and the charms are all 1.15.4 content this port does not have, and a tile with no Item
# registered to it is stitched into an atlas that nothing will ever ask for.
#
# ⚠️ The WORN armour art is not here and cannot be. These three are inventory ICONS, cut out of a
# sprite sheet. The textures drawn on the player's body are whole separate files
# (naga_scale_1.png / naga_scale_2.png) that are copied rather than sliced, so they ride the plain
# file-copy lane in asset-bridge.properties instead.
#
# --- ⚠️ The destination path is not free ---------------------------------------------------------
# It must be `item/naga_scale`, because BTA's ItemModelStandard looks a texture up by the item's own
# NamespaceID -- `twilightforest:item/naga_scale`, which is what TFItems passes to the Item
# constructor. A tile cut to any other name stitches into the atlas and is never asked for, and the
# item draws as nothing at all with no error. That is the same silent failure the block models had.

items.png#0 = assets/twilightforest/textures/item/naga_scale.png
items.png#16 = assets/twilightforest/textures/item/naga_scale_tunic.png
items.png#32 = assets/twilightforest/textures/item/naga_scale_leggings.png

# --- The dark tower's key ------------------------------------------------------------------------
# Index 39, and it is COMPUTED rather than counted. TFItems registers the key with `.b(7, 2)`, which
# is upstream's (column, row) sprite setter -- so the flat index is row * 16 + column = 2 * 16 + 7.
# Cross-checked against two neighbours registered the same way in the same file: `fieryIngot` is
# .b(4, 2) = 36 and `hydraChop` is .b(8, 5) = 88, and both land on the right art.
#
# ⚠️ Do not count this one off the sheet by eye. Row 2 of items.png is a dense run of ingots and
# small metal objects, and a key looks like several of them at 16x16.
items.png#39 = assets/twilightforest/textures/item/tower_key.png
