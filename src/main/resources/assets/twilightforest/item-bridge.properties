# Item-texture bridge manifest.
#
# The companion to block-bridge.properties, and the same mechanism: Twilight Forest 1.7.1 predates
# Minecraft 1.5, so its item art lives in one `items.png` addressed by tile index, and BTA wants one
# PNG per texture. TFBlockTextureBridge reads both files and does the cutting.
#
#   <archive file name>#<tile index> = <path inside the generated pack>
#
# Reading left to right, top to bottom: column = index & 15, row = index >> 4. The tile SIZE is
# derived from the sheet rather than assumed -- a sheet is 16 tiles across whatever its resolution,
# so tile = width / 16.
#
# --- Why this is a separate file from the blocks -------------------------------------------------
# Not because the cutting differs -- it is identical. Because the DESTINATION differs: BTA stitches
# `block/...` and `item/...` into separate atlases, looked up by separate dispatchers
# (BlockModelDispatcher and ItemModelDispatcher). The two lists feed different pipelines and fail in
# different ways, so they are kept apart.
#
# --- Why there is exactly one line ---------------------------------------------------------------
# Twilight Forest 1.7.1 -- the version being PORTED -- registers exactly one item, the Naga Scale,
# and `TFItems` builds it as
#
#     nagaScale = new ItemTF(idItemNagaScale).setIconIndex(0).setItemName("nagaScale")
#
# so tile 0 is the whole item roster. Measured against the archive rather than trusted: 1.7.1's
# items.png is 256x256 (tile 16), and tile 0 is the ONLY tile in it with any non-transparent pixel --
# 72 of 256, a small scale-shaped sprite. Every other tile is empty.
#
# ⚠️ The DONOR is 1.15.4, whose items.png is emphatically not empty -- it carries a full armour and
# tool roster for content this port does not have. The line below is still correct: 1.15.4's TFItems
# also builds the scale as `.setIconIndex(0)`, verified rather than assumed. The rest of that sheet
# is deliberately not bridged, because an item with no Item registered to it is a tile stitched into
# an atlas that nothing will ever ask for.
#
# --- ⚠️ The destination path is not free ---------------------------------------------------------
# It must be `item/naga_scale`, because BTA's ItemModelStandard looks a texture up by the item's own
# NamespaceID -- `twilightforest:item/naga_scale`, which is what TFItems passes to the Item
# constructor. A tile cut to any other name stitches into the atlas and is never asked for, and the
# item draws as nothing at all with no error. That is the same silent failure the block models had.

items.png#0 = assets/twilightforest/textures/item/naga_scale.png
