# --- The wraith's one voice -----------------------------------------------------------------------
# Four files behind a SINGLE event. EntityTFWraith returns `mob.tf.wraith.wraith` from all three
# getters -- living, hurt and death -- so every noise a wraith ever makes is one of these four, and
# the only thing that changes between drifting, being hit and dying is which of the four came up.
# That is upstream's, and it is more extreme than the Naga's hurt-doubles-as-death: there, at least,
# the ambient sound differs from the other two.
#
# ⚠️ It is also the counter-example to the Redcap above, and worth keeping next to it for that: here
# the archive's file names and upstream's event layout agree completely, so all four are plain moves.
# That agreement is a coincidence of this one mob and not a rule -- checking TFSounds is what tells
# you which case you are in, and nothing about a file name can.
#
# The skin these belong to is ghost-crown.png, further up; wraith.png is the uncrowned variant that
# nothing loads. The naming is unrelated to the sounds, which really are `wraith*`.
wraith0.ogg        = packResources/twilightforest/sounds/mob/tf/wraith/wraith0.ogg
wraith1.ogg        = packResources/twilightforest/sounds/mob/tf/wraith/wraith1.ogg
wraith2.ogg        = packResources/twilightforest/sounds/mob/tf/wraith/wraith2.ogg
wraith3.ogg        = packResources/twilightforest/sounds/mob/tf/wraith/wraith3.ogg

