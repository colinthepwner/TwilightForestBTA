# Texture bridge manifest.
#
# Maps a file inside a player-supplied copy of Benimatic's Twilight Forest onto the path this mod
# loads it from. This mod ships NONE of the original's art -- the bridge only reads a copy the
# player already has on disk and writes the result into their generated texture pack.
#
# --- ⚠️ The DONOR is 1.15.4. The PORT TARGET is still 1.7.1 ---------------------------------------
# These are two different things and conflating them will waste an afternoon.
#
#   what is being ported   Twilight Forest 1.7.1 (Minecraft 1.2.3) -- the generators, the mobs, the
#                          structures. Unchanged. docs/tf-1.7.1-inventory.md still governs.
#   where the art comes    Twilight Forest 1.15.4 (Minecraft 1.4.7) -- a strict superset of 1.7.1's
#   from                   art, so the player supplies ONE file instead of two.
#
# The swap costs nothing here because 1.15.4 keeps every name: all fourteen skins below are present
# in it, spelled identically. See docs/tf-1.15.4-inventory.md §3 for the checklist, and note that
# 1.4.7 predates Minecraft 1.5 -- so the sprite sheets are still sheets and the slicing lane in
# block-bridge.properties still applies.
#
# It is also why the foliage work can happen at all: darkwood and rainbow oak need tiles that only
# exist in the newer sheet.
#
#   <file name in the archive> = <path inside the generated pack>
#
# --- ⚠️ Keys are the BARE file name ---------------------------------------------------------------
# Not a path. TFAssetBridge.baseName() reduces every archive entry to its last segment, lower case,
# before matching -- so `wildboar.png` matches and `twilightforest/wildboar.png` matches nothing at
# all, silently, and every texture is reported missing. An earlier revision of this file carried the
# directory prefix and bridged zero textures because of it.
#
# The bare name is also what makes the bridge indifferent to how the archive is laid out, which is
# the point: the original ships as a zip inside a zip, and people re-pack it.
#
# --- The list -------------------------------------------------------------------------------------
# The donor ships 61 PNGs (1.7.1 shipped 20). Only the skins the PORT uses are here -- the rest are
# for content that is not ported, and bridging art nobody asks for just makes the pack bigger and the
# "missing" count meaningless. Block art lives in terrain.png and is cut into tiles by
# block-bridge.properties instead, because a pre-1.5 sprite sheet cannot be handed to BTA's atlas
# as-is.
#
# Each of these is paired with a geometry entry in model-bridge.properties, and the pairing is
# load-bearing rather than tidy: the original's skins are painted against the original's box layout,
# so a skin bridged without its geometry lands on boxes it was never drawn for. See
# docs/asset-bridge.md and the geometry manifest's own header.

# ⚠️ ENTITY SKINS ARE A DIRECTORY, NOT A FILE, and getting this wrong is silent.
#
# BTA 8.0's Mob.setTextureIdentifier(namespace, name) builds
#     /assets/<namespace>/textures/entity/<name>/
# and then appends a SKIN VARIANT: getEntityTexture() returns basePath + variant + ".png", where the
# variant defaults to "0" and can be redirected per entity by a variants.json in the same directory.
# Read off Mob.class in the deobfuscated 8.0.1 jar, not guessed -- the format string and the "0" are
# both constants in setTextureIdentifier/getTextureReference.
#
# So a mob whose identifier is "redcap" loads
#     assets/twilightforest/textures/entity/redcap/0.png
# and NOT redcap.png. The failure mode when this is wrong is exactly what it looks like: the bridged
# GEOMETRY loads (Dragonfly reads models/entity/<id>.json, a different path that was already right)
# and the mob renders as an untextured white model. Nothing logs, because a missing entity texture is
# a normal fallback in BTA, not an error.
#
# ⚠️ This applies ONLY to textures a Mob resolves through its identifier. A texture a renderer binds
# by hand -- firefly-tiny.png, cicada-model.png -- is a literal resource path and stays flat. Moving
# one of those into a directory breaks the renderer that names it.

# --- Carried over from the 1.p4 port; the same three animals, the same file names ---
wildboar.png       = assets/twilightforest/textures/entity/wildboar/0.png
bighorn.png        = assets/twilightforest/textures/entity/bighorn/0.png
wilddeer.png       = assets/twilightforest/textures/entity/wilddeer/0.png

# --- 1.7.1's own roster ---
penguin.png        = assets/twilightforest/textures/entity/penguin/0.png
swarmspider.png    = assets/twilightforest/textures/entity/swarmspider/0.png
hedgespider.png    = assets/twilightforest/textures/entity/hedgespider/0.png
redcap.png         = assets/twilightforest/textures/entity/redcap/0.png
skeletondruid.png  = assets/twilightforest/textures/entity/skeletondruid/0.png

# ⚠️ The wraith uses ghost-crown.png, NOT wraith.png. Both are in the archive and it is
# EntityTFWraith's own constructor that names the crowned one; wraith.png is the uncrowned variant
# and nothing loads it. Bridged to the crowned name the entity actually asks for.
ghost-crown.png    = assets/twilightforest/textures/entity/ghost-crown/0.png

# --- The Naga: two skins, head and body, exactly as the two entities are ---
nagahead.png       = assets/twilightforest/textures/entity/nagahead/0.png
nagasegment.png    = assets/twilightforest/textures/entity/nagasegment/0.png

# --- The Lich and the firefly spark ---
# The Lich's skin is 64x64 rather than the 32x32 the other humanoids use, which is why ModelTFLich
# sets textureWidth/Height to 64 -- the geometry manifest carries the same number, and a mismatch
# there puts every box on the wrong part of the sheet.
twilightlich64.png = assets/twilightforest/textures/entity/twilightlich64/0.png

# The firefly's glow sheet, used by TWO things: RendererTFTinyFirefly draws the drifting spark from
# it on a billboard quad, and TileEntityTFFireflyRenderer binds this same path for the firefly
# BLOCK's model -- upstream names it in both.
#
# ⚠️ It is 64x32, not the 16x16 an earlier revision of this comment claimed, and its alpha is a
# GRADIENT (measured: 0, 1, 2, 4, 7, 8, ...) rather than the 0/255 cutout a mob skin has. That is
# what makes it work in the renderer's additive second pass -- glBlendFunc(SRC_ALPHA, ONE) with the
# alpha test off, modulated by glowIntensity. Anything that flattens that alpha turns the pulse into
# a solid block of colour.
firefly-tiny.png   = assets/twilightforest/textures/entity/firefly-tiny.png

# The cicada's model skin. Flat like firefly-tiny.png and for the same reason: it is bound by hand
# by TileEntityRendererTFCicada, which names this exact path, rather than looked up per-entity.
cicada-model.png   = assets/twilightforest/textures/entity/cicada-model.png

# --- The ambient four, from the 1.15.4 donor ------------------------------------------------------
# ⚠️ VARIANT NUMBERING IS LOAD-BEARING for the two multi-skin mobs. BTA resolves
# textures/entity/<name>/<n>.png from Mob.setSkinVariant(n), so the number on the right below IS the
# variant index, and it has to match the order of upstream's own getTexture switch or every bunny and
# every bird comes out the wrong colour.
#
#   bunny      0 dutch, 1 dutch, 2 white, 3 brown   <- 0 and 1 really are both dutch, see MobTFBunny
#   tinybird   0 brown, 1 blue,  2 red,   3 gold
#
# ⚠️ ONE SOURCE FILE, TWO DESTINATIONS -- comma-separated, NOT two lines with the same key. This file
# is read by java.util.Properties, where a repeated key silently keeps only the last value, so
# writing bunnydutch.png twice would bridge variant 1 and leave variant 0 untextured. The value is
# split on commas precisely so a file can land in more than one place; see TFAssetBridge.readManifest.
bunnydutch.png     = assets/twilightforest/textures/entity/bunny/0.png, \
                     assets/twilightforest/textures/entity/bunny/1.png
bunnywhite.png     = assets/twilightforest/textures/entity/bunny/2.png
bunnybrown.png     = assets/twilightforest/textures/entity/bunny/3.png

tinybirdbrown.png  = assets/twilightforest/textures/entity/tinybird/0.png
tinybirdblue.png   = assets/twilightforest/textures/entity/tinybird/1.png
tinybirdred.png    = assets/twilightforest/textures/entity/tinybird/2.png
tinybirdgold.png   = assets/twilightforest/textures/entity/tinybird/3.png

# ⚠️ squirrel2.png, not squirrel.png. There is no unnumbered original in the archive.
squirrel2.png      = assets/twilightforest/textures/entity/squirrel/0.png
raven.png          = assets/twilightforest/textures/entity/raven/0.png

# --- Armour ---------------------------------------------------------------------------------------
# The Naga Scale tunic and leggings as drawn ON THE PLAYER, which is a different thing from their
# inventory icons -- those are tiles cut out of items.png by item-bridge.properties.
#
# ⚠️ THE DESTINATION PATH IS DICTATED BY BTA AND IS NOT A CHOICE. MobRendererBipedArmored builds the
# path by formatting
#
#     /assets/%s/textures/armor/%s_%d.png
#
# with the NAMESPACE and PATH of the armour material's NamespaceID and the layer number. TFItems
# names the material `twilightforest:naga_scale`, so BTA asks for exactly the two names below and
# nothing else will be looked at.
#
# The happy accident that makes this two plain copies rather than a conversion: Minecraft 1.4.7 --
# the donor's game -- already split worn armour into a `_1` body layer and a `_2` legs layer, and BTA
# still does. Upstream's own ItemTFNagaArmor.getArmorTextureFile returns "naga_scale_1.png" for the
# plate and "naga_scale_2.png" for the legs, which is layer for layer what BTA wants. So the file
# names match on both sides and the bridge only has to move them.
naga_scale_1.png   = assets/twilightforest/textures/armor/naga_scale_1.png
naga_scale_2.png   = assets/twilightforest/textures/armor/naga_scale_2.png

# --- Not yet wired to anything, but bridged so the entities can be added without a second pass ---
# hydra4.png         -- the Hydra

# --- Sound ----------------------------------------------------------------------------------------
# The mod's only audio: the cicada's two songs. Everything above this line is art, and these ride the
# same lane because the bridge matches on BASE NAME and never looks at a file's extension -- an .ogg
# is copied exactly as a .png is.
#
# ⚠️ THESE TWO GO TO packResources/, NOT INTO THE TEXTURE PACK, and it is the only reason they work.
# BTA does not read audio out of a texture pack: NamedSoundRepository loads from
# <gameDir>/packResources/<namespace>/sounds/, which is where its own minecraft/sounds/**.ogg live and
# where SoundRepository.namespaceAdded creates an empty directory for every mod namespace. A path
# beginning `packResources/` is written relative to the GAME DIRECTORY -- see TFAssetBridge.write.
# Bridged into the pack instead, the files land, the log says they were bridged, and nothing can hear
# them.
#
# The KEY IS THE PATH: `mob/tf/cicada2.ogg` becomes the sound event `mob.tf.cicada` with the trailing
# digit as its variant, which is upstream's own name -- TileEntityTFCicada asks for
# `twilightforest:mob.tf.cicada`. Move the file and the sound silently stops existing.
#
# In 1.7.1 these lived at resources/mod/sound/mob/tf/ and in the 1.15.4 donor they live at
# twilightforest/sounds/ -- which the base-name match makes irrelevant, and is a good demonstration
# of why the match is on base name at all. The Naga's eight and the Redcap's thirteen come out of the
# same donor directory and are at the bottom of this file.
cicada2.ogg        = packResources/twilightforest/sounds/mob/tf/cicada2.ogg
cicada3.ogg        = packResources/twilightforest/sounds/mob/tf/cicada3.ogg

# The birds. Destination paths are upstream's own event names, read out of TFSounds.addSound rather
# than inferred from the file names -- the archive stores them as `tinybirdchirp0.ogg` but the EVENT
# is `mob/tf/tinybird/chirp` with 0 as its variant digit, and it is the destination that decides.
tinybirdchirp0.ogg = packResources/twilightforest/sounds/mob/tf/tinybird/chirp0.ogg
tinybirdchirp1.ogg = packResources/twilightforest/sounds/mob/tf/tinybird/chirp1.ogg
tinybirdchirp2.ogg = packResources/twilightforest/sounds/mob/tf/tinybird/chirp2.ogg
tinybirdhurt0.ogg  = packResources/twilightforest/sounds/mob/tf/tinybird/hurt0.ogg
tinybirdhurt1.ogg  = packResources/twilightforest/sounds/mob/tf/tinybird/hurt1.ogg
ravencaw0.ogg      = packResources/twilightforest/sounds/mob/tf/raven/caw0.ogg
ravencaw1.ogg      = packResources/twilightforest/sounds/mob/tf/raven/caw1.ogg
ravensquawk0.ogg   = packResources/twilightforest/sounds/mob/tf/raven/squawk0.ogg
ravensquawk1.ogg   = packResources/twilightforest/sounds/mob/tf/raven/squawk1.ogg

# ⚠️ tinybirdsong0/1.ogg are NOT here and that is deliberate: TFSounds registers them under
# mob/tf/tinybird/song and no entity in the archive ever names that event. Two files upstream ships
# and does not use.

# --- The small hostiles, from the 1.15.4 donor ----------------------------------------------------
kobold.png         = assets/twilightforest/textures/entity/kobold/0.png
firebeetle.png     = assets/twilightforest/textures/entity/firebeetle/0.png
slimebeetle.png    = assets/twilightforest/textures/entity/slimebeetle/0.png
pinchbeetle.png    = assets/twilightforest/textures/entity/pinchbeetle/0.png
mosquitoswarm.png  = assets/twilightforest/textures/entity/mosquitoswarm/0.png
redcapsapper.png   = assets/twilightforest/textures/entity/redcapsapper/0.png

# --- The labyrinth's two, from the 1.15.4 donor ---------------------------------------------------
# Both file names are EntityTFMinotaur's and EntityTFMazeSlime's own `this.texture = ...` strings,
# read out of the archive rather than inferred from the class names -- which agree here, but did not
# for the wraith (see ghost-crown.png above).
minotaur.png       = assets/twilightforest/textures/entity/minotaur/0.png
#
# ⚠️ The maze slime has a SKIN here and NO geometry entry in model-bridge.properties, which is the
# only mob in this port with that combination. Upstream gives it no model class either: it extends
# EntitySlime and draws on the vanilla slime model, and here it extends MobSlime and draws on BTA's.
# So the art is Benimatic's and the boxes are the game's. Adding a geometry entry would look for a
# ModelTFMazeSlime that does not exist and log a miss every launch -- the same trap the redcap sapper
# note at the bottom of model-bridge.properties describes.
mazeslime.png      = assets/twilightforest/textures/entity/mazeslime/0.png

# --- The two bosses, from the 1.15.4 donor --------------------------------------------------------
#
# ⚠️ MINOSHROOMTAUR, NOT MINOSHROOM. EntityTFMinoshroom's own constructor names
# `/twilightforest/minoshroomtaur.png` and the file in the archive is spelled that way; the CLASS is
# EntityTFMinoshroom. Same trap as the wraith's ghost-crown.png, and it is why MobTFMinoshroom's
# setTextureIdentifier says "minoshroomtaur" -- BTA builds the directory out of that string, so a
# mismatch here is a white untextured model and no log line at all.
#
# ⚠️ It is 128x32, not the 64x32 most of the archive's skins are: ModelTFMinoshroom opens with
# `textureWidth = 128; textureHeight = 32`. model-bridge.properties carries the matching uv-size and
# the two have to agree or every box samples the wrong quarter of the sheet.
minoshroomtaur.png = assets/twilightforest/textures/entity/minoshroomtaur/0.png

# The Questing Ram. 128x128, and the whole skin is used -- the horns alone take four rows of it.
questram.png       = assets/twilightforest/textures/entity/questram/0.png
#
# ⚠️ questram_lines.png is DELIBERATELY NOT BRIDGED, and it is the one skin in this file left out on
# purpose rather than for want of a mob. RenderTFQuestRam binds it in a second render pass -- 1.025
# scale, additive blend, light map forced to 61680 -- to draw the pale glowing seams over the ram.
# BTA's MobRenderer selects a MODEL per layer, not a texture and a blend mode, and nothing in this
# port drives a second bound texture per entity, so there is nothing that would ever load the file.
# Bridging it would put an unread PNG in every player's generated pack and count it as a success.
# See TFBossRenderers.QuestRam, which is where the pass would go.

# --- The dark tower's five skins, from the 1.15.4 donor -------------------------------------------
#
# ⚠️ THE THREE GHAST FILES ARE ONE MOB'S THREE STATES, NOT THREE MOBS.
# EntityTFTowerGhast reassigns `this.texture` every tick from a data watcher byte: 0 calm, 1 eyes
# open, 2 mouth alight. BTA resolves an entity's skin through getEntityTexture() instead, so
# MobTFTowerGhast returns basePath + <state> + ".png" and the three files land as the three numbered
# skins of ONE identifier.
#
# ⚠️ That is why they are 0/1/2.png under `towerghast/` and not three directories. Anyone reading
# these three lines as "three mobs" and giving each its own directory breaks the state switch
# silently -- the mob would render, in its calm skin, for ever.
#
# ⚠️ And all THREE ghasts share this one directory: upstream's mini ghast and Ur-Ghast name
# towerghast.png in their own constructors too. There is no separate boss skin in the archive; the
# Ur-Ghast is the same painting at four times the scale.
towerghast.png          = assets/twilightforest/textures/entity/towerghast/0.png
towerghast_openeyes.png = assets/twilightforest/textures/entity/towerghast/1.png
towerghast_fire.png     = assets/twilightforest/textures/entity/towerghast/2.png

# The redscale broodling. A swarm spider reskin, painted for the vanilla spider UV layout that
# MobTFSwarmSpider's renderer already draws -- so this is a skin with no geometry entry, the same
# combination the maze slime is in above.
towerbroodling.png = assets/twilightforest/textures/entity/towerbroodling/0.png
towergolem.png     = assets/twilightforest/textures/entity/towergolem/0.png
towertermite.png   = assets/twilightforest/textures/entity/towertermite/0.png
#
# ⚠️ THE GOLEM AND THE TERMITE HAVE NO model-bridge.properties ENTRY EITHER, AND FOR A REASON THAT IS
# NOT THE MAZE SLIME'S. The maze slime borrows a shape BTA ships. These two borrow shapes it does
# NOT: towergolem.png is a 128x128 IRON GOLEM reskin (ModelTFTowerGolem extends ModelIronGolem and
# declares no boxes at all) and towertermite.png is a 64x32 SILVERFISH reskin (the termite has no
# model class -- TFClientProxy hands it Minecraft's ModelSilverfish). BTA has neither mob, so
# base.*.slots has nothing to compose against and the bridge cannot produce them.
#
# So this mod SHIPS those two geometries. See tools/gen_tower_geometry.py and
# TFGeometryBridge.BUILTIN_MODEL_IDS. The skins above are still bridged -- only the boxes are ours,
# which is the same split the mosquito swarm is in.
#
# ⚠️ Nothing is bridged for the GHAST GEOMETRY and nothing needs to be: ModelTFGhast in the archive
# is Minecraft's ModelGhast character for character, down to the Random seeded with 1660L, so BTA's
# own geometry.ghast is the same shape. The three ghasts render with no archive present at all.

# --- The kobold's voice, and a trap in the key ----------------------------------------------------
# ⚠️ THE SPACES ARE ESCAPED, and they have to be. This file is read by java.util.Properties, where an
# unescaped space is a key/value separator just like `=` -- so `kobold growl 1.ogg = ...` parses as
# the key `kobold` with the value `growl 1.ogg = ...`, and the first such line would silently claim
# the key for all thirteen. Benimatic named these with spaces; only the escaping is ours.
#
# The destination is upstream's own event layout out of TFSounds.addSound, which renames every one:
# `kobold growl 1.ogg` is served as `mob/tf/kobold/kobold0.ogg`, i.e. variant 0 of the event
# `mob.tf.kobold.kobold`. Six of the thirteen -- three growls, a sniff and two snorts -- share that
# one event, so a kobold picks from all six as it mutters.
kobold\ growl\ 1.ogg = packResources/twilightforest/sounds/mob/tf/kobold/kobold0.ogg
kobold\ growl\ 2.ogg = packResources/twilightforest/sounds/mob/tf/kobold/kobold1.ogg
kobold\ growl\ 3.ogg = packResources/twilightforest/sounds/mob/tf/kobold/kobold2.ogg
kobold\ sniff\ 1.ogg = packResources/twilightforest/sounds/mob/tf/kobold/kobold3.ogg
kobold\ snort\ 1.ogg = packResources/twilightforest/sounds/mob/tf/kobold/kobold4.ogg
kobold\ snort\ 2.ogg = packResources/twilightforest/sounds/mob/tf/kobold/kobold5.ogg
kobold\ hurt\ 1.ogg  = packResources/twilightforest/sounds/mob/tf/kobold/hurt0.ogg
kobold\ hurt\ 2.ogg  = packResources/twilightforest/sounds/mob/tf/kobold/hurt1.ogg
kobold\ hurt\ 3.ogg  = packResources/twilightforest/sounds/mob/tf/kobold/hurt2.ogg
kobold\ die\ 1.ogg   = packResources/twilightforest/sounds/mob/tf/kobold/die0.ogg
kobold\ die\ 2.ogg   = packResources/twilightforest/sounds/mob/tf/kobold/die1.ogg
kobold\ die\ 3.ogg   = packResources/twilightforest/sounds/mob/tf/kobold/die2.ogg

# ⚠️ `kobold snorfle.ogg` is in the archive and TFSounds never registers it. Left out for the same
# reason the tiny bird's song is: unregistered upstream means unbridged here.
#
# ⚠️ The mosquito's whine is the archive's only .wav. Bridged under upstream's own event name;
# whether BTA's sound repository loads a .wav at all is unverified.
animals132.wav     = packResources/twilightforest/sounds/mob/tf/mosquito/mosquito0.wav

# --- The Naga and the Redcap, from the 1.15.4 donor -----------------------------------------------
# Twenty-one files for two mobs this port already ships. Every destination below is read out of
# TFSounds.addSound and NOT off the file name, and the Redcap is where that stops being pedantry:
#
#   redcap0.ogg     -> mob/tf/redcap/redcap0.ogg    name kept
#   redcaphurt0.ogg -> mob/tf/redcap/hurt0.ogg      RENAMED, event mob.tf.redcap.hurt
#   redcapdie0.ogg  -> mob/tf/redcap/die0.ogg       RENAMED, event mob.tf.redcap.die
#
# Six of the thirteen keep their name and seven do not. Bridged under the archive's own names the
# last seven would serve `mob.tf.redcap.redcaphurt` and `mob.tf.redcap.redcapdie`, which nothing
# upstream ever asks for -- seven files landing correctly, counted as bridged, and inaudible, with
# nothing in the log. Same trap as the tiny bird's chirps above; it is just bigger here.
#
# ⚠️ THE FILE NAME IS NO LONGER THE EVENT -- and these paths still matter anyway.
# In 1.4.7 the destination WAS the event: SoundPool.addSound dropped the extension, chewed the
# trailing digits off, and turned the slashes into dots, so `mob/tf/redcap/hurt0.ogg` became the pool
# `mob.tf.redcap.hurt` with 0 as one of its variants. BTA does not derive anything -- sounds.json
# names each event and lists its files explicitly, so a file here could be called almost anything and
# still play. They are kept identical to upstream's registration so that sounds.json can be read
# against this file line for line, and so the next person diffing either against TFSounds gets the
# answer they expect.

# --- ⚠️ THE THIRD NAGA HISS: the one place this file knowingly disagrees with upstream ------------
# TFSounds registers nagahiss2.ogg at `mob/tf/naga/hiss1.ogg` -- the destination it gave nagahiss1.ogg
# on the line above. A copy-paste slip, and in 1.4.7 an invisible one: SoundPool keys on the
# digit-stripped name and APPENDS to a list, so both files land in the pool `mob.tf.naga.hiss` as
# separate entries and the player hears three distinct hisses. The duplicate string is only a label
# on an entry nothing looks up by name.
#
# It does not survive the move. Two lines here writing one path means the second copy wins and a hiss
# is silently lost; listing hiss1.ogg twice in sounds.json would play the same file twice. So
# nagahiss2.ogg goes to hiss2.ogg and sounds.json lists three variants, which reproduces what the
# original SOUNDS like rather than what it literally says. Transcribing the slip would have been the
# more faithful edit to the source and the less faithful one to the mob.
nagahiss0.ogg      = packResources/twilightforest/sounds/mob/tf/naga/hiss0.ogg
nagahiss1.ogg      = packResources/twilightforest/sounds/mob/tf/naga/hiss1.ogg
nagahiss2.ogg      = packResources/twilightforest/sounds/mob/tf/naga/hiss2.ogg
nagahurt0.ogg      = packResources/twilightforest/sounds/mob/tf/naga/hurt0.ogg
nagahurt1.ogg      = packResources/twilightforest/sounds/mob/tf/naga/hurt1.ogg
nagahurt2.ogg      = packResources/twilightforest/sounds/mob/tf/naga/hurt2.ogg
nagarattle0.ogg    = packResources/twilightforest/sounds/mob/tf/naga/rattle0.ogg
nagarattle1.ogg    = packResources/twilightforest/sounds/mob/tf/naga/rattle1.ogg

# Three events, all three named by EntityTFNaga: hiss two thirds of the time and rattle the other
# third while alive, and hurt for BOTH being struck and dying. There is no naga death sound in the
# archive and upstream does not want one -- getDeathSound returns the hurt event.
#
# ⚠️ The SEGMENTS name none of them and are deliberately mute; see MobTFNagaSegment. A body of twelve
# links each picking its own living sound would be twelve overlapping hisses off one mob.

# The Redcap's six mutters, four hurts and three deaths. The sapper shares all of them: upstream's
# EntityTFRedcapSapper overrides none of the three getters, so redcapsapper.png is the only thing
# that tells the two apart and it is a skin, not a voice.
redcap0.ogg        = packResources/twilightforest/sounds/mob/tf/redcap/redcap0.ogg
redcap1.ogg        = packResources/twilightforest/sounds/mob/tf/redcap/redcap1.ogg
redcap2.ogg        = packResources/twilightforest/sounds/mob/tf/redcap/redcap2.ogg
